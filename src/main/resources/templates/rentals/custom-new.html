<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create custom rental draft</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4 py-md-5" style="max-width:800px">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/rentals}">Back to rentals</a>
    <section class="card shadow-sm border-0"><div class="card-body p-4 p-md-5">
        <h1 class="h2 text-success mb-2">Create custom rental draft</h1><p class="text-muted mb-4">Choose equipment and quantities. Prices, stock, and package contents are validated by the server.</p>
        <div class="btn-group mb-4" role="group"><a class="btn btn-outline-success" th:href="@{/rentals/new}">Thuê theo gói</a><a class="btn btn-success" th:href="@{/rentals/custom/new}">Thuê từng món</a></div>
        <form method="post" th:action="@{/rentals/custom}" th:object="${customRentalDraftForm}" novalidate>
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert"><strong>Please correct the highlighted fields.</strong><ul class="mb-0 mt-2"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
            <div class="mb-3"><label class="form-label" for="customerId">Customer ID</label><input class="form-control" id="customerId" th:field="*{customerId}" required autocomplete="off"></div>
            <div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="rentalDate">Rental date</label><input class="form-control" id="rentalDate" type="date" th:field="*{rentalDate}" required></div><div class="col-md-6 mb-3"><label class="form-label" for="expectedReturnDate">Expected return date</label><input class="form-control" id="expectedReturnDate" type="date" th:field="*{expectedReturnDate}" required></div></div>
            <div class="mb-3"><label class="form-label">Equipment items</label><div id="equipment-items"><div class="row g-2 mb-2" th:each="item, stat : *{items}"><div class="col-md-8"><select class="form-select" th:name="${'items[' + stat.index + '].equipmentId'}" required><option value="">Choose equipment</option><option th:each="equipment : ${equipmentOptions}" th:value="${equipment.equipmentId}" th:text="${equipment.equipmentId + ' — ' + equipment.name}" th:selected="${equipment.equipmentId == item.equipmentId}"></option></select></div><div class="col-md-4"><input class="form-control" type="number" min="1" step="1" th:name="${'items[' + stat.index + '].quantity'}" th:value="${item.quantity}" placeholder="Quantity" required></div></div></div><button class="btn btn-outline-success btn-sm" id="add-equipment" type="button">Add item</button></div>
            <div class="d-flex flex-wrap gap-2"><button class="btn btn-success" type="submit">Create pending draft</button><a class="btn btn-outline-secondary" th:href="@{/rentals}">Cancel</a></div>
        </form>
    </div></section>
</main><template id="equipment-row-template"><div class="row g-2 mb-2"><div class="col-md-8"><select class="form-select" name="items[__INDEX__].equipmentId" required><option value="">Choose equipment</option><option th:each="equipment : ${equipmentOptions}" th:value="${equipment.equipmentId}" th:text="${equipment.equipmentId + ' — ' + equipment.name}"></option></select></div><div class="col-md-4"><input class="form-control" type="number" min="1" step="1" name="items[__INDEX__].quantity" placeholder="Quantity" required></div></div></template><script>const items=document.getElementById('equipment-items'),template=document.getElementById('equipment-row-template'),max=10;document.getElementById('add-equipment').addEventListener('click',()=>{if(items.children.length>=max)return;items.insertAdjacentHTML('beforeend',template.innerHTML.replaceAll('__INDEX__',items.children.length));});</script></body>
</html>
