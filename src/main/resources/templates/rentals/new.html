<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head('Tạo đơn thuê theo gói')}"></th:block></head>
<body class="bg-light"><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4 py-md-5" style="max-width:720px">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/rentals}">Back to rentals</a>
    <section class="card shadow-sm border-0"><div class="card-body p-4 p-md-5">
        <h1 class="h2 text-success mb-2">Create rental draft</h1><p class="text-muted mb-3">Choose a package. Its equipment and quantities are defined securely by the server.</p><div class="btn-group mb-4" role="group"><a class="btn btn-success" th:href="@{/rentals/new}">Thuê theo gói</a><a class="btn btn-outline-success" th:href="@{/rentals/custom/new}">Thuê từng món</a></div>
        <form method="post" th:action="@{/rentals}" th:object="${rentalDraftForm}" novalidate>
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert"><strong>Please correct the highlighted fields.</strong><ul class="mb-0 mt-2"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
            <div class="mb-3"><label class="form-label" for="customerId">Customer ID</label><input class="form-control" th:classappend="${#fields.hasErrors('customerId')} ? ' is-invalid'" id="customerId" th:field="*{customerId}" required autocomplete="off"><div class="invalid-feedback" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></div></div>
            <div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="rentalDate">Rental date</label><input class="form-control" th:classappend="${#fields.hasErrors('rentalDate')} ? ' is-invalid'" id="rentalDate" type="date" th:field="*{rentalDate}" required><div class="invalid-feedback" th:if="${#fields.hasErrors('rentalDate')}" th:errors="*{rentalDate}"></div></div><div class="col-md-6 mb-3"><label class="form-label" for="expectedReturnDate">Expected return date</label><input class="form-control" th:classappend="${#fields.hasErrors('expectedReturnDate')} ? ' is-invalid'" id="expectedReturnDate" type="date" th:field="*{expectedReturnDate}" required><div class="invalid-feedback" th:if="${#fields.hasErrors('expectedReturnDate')}" th:errors="*{expectedReturnDate}"></div></div></div>
            <div class="mb-4"><label class="form-label" for="packageType">Camping package</label><select class="form-select" th:classappend="${#fields.hasErrors('packageType')} ? ' is-invalid'" id="packageType" th:field="*{packageType}" required><option value="">Choose a package</option><option th:each="type : ${packageTypes}" th:value="${type}" th:text="${type}"></option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('packageType')}" th:errors="*{packageType}"></div></div>
            <div class="d-flex flex-wrap gap-2"><button class="btn btn-success" type="submit">Create pending draft</button><a class="btn btn-outline-secondary" th:href="@{/rentals}">Cancel</a></div>
        </form>
    </div></section>
</main></body>
</html>
