<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create rental draft</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="bg-light"><main class="container py-5" style="max-width:720px"><section class="card shadow-sm border-0"><div class="card-body p-4"><h1 class="h3 text-success">Create rental draft</h1><p class="text-muted">Package items are selected securely by the server.</p><form method="post" th:action="@{/rentals}" th:object="${rentalDraftForm}"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div><div class="mb-3"><label for="customerId">Customer ID</label><input class="form-control" id="customerId" th:field="*{customerId}" required></div><div class="row"><div class="col-md-6 mb-3"><label for="rentalDate">Rental date</label><input class="form-control" id="rentalDate" type="date" th:field="*{rentalDate}" required></div><div class="col-md-6 mb-3"><label for="expectedReturnDate">Expected return date</label><input class="form-control" id="expectedReturnDate" type="date" th:field="*{expectedReturnDate}" required></div></div><div class="mb-4"><label for="packageType">Camping package</label><select class="form-select" id="packageType" th:field="*{packageType}" required><option value="">Choose a package</option><option th:each="type : ${packageTypes}" th:value="${type}" th:text="${type}"></option></select></div><button class="btn btn-success" type="submit">Create pending draft</button></form></div></section></main></body></html>
