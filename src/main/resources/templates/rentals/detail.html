<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rental detail</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="bg-light"><main class="container py-5" style="max-width:900px"><a class="btn btn-outline-secondary mb-3" th:href="@{/rentals}">Back to rentals</a><section class="card shadow-sm border-0"><div class="card-body"><h1 class="h3 text-success" th:text="${'Rental ' + order.id}"></h1><dl class="row"><dt class="col-sm-4">Customer</dt><dd class="col-sm-8" th:text="${order.customerId}"></dd><dt class="col-sm-4">Rental date</dt><dd class="col-sm-8" th:text="${order.rentalDate}"></dd><dt class="col-sm-4">Expected return</dt><dd class="col-sm-8" th:text="${order.expectedReturnDate}"></dd><dt class="col-sm-4" th:if="${order.actualReturnDate != null}">Actual return</dt><dd class="col-sm-8" th:if="${order.actualReturnDate != null}" th:text="${order.actualReturnDate}"></dd><dt class="col-sm-4">State</dt><dd class="col-sm-8" th:text="${stateName}"></dd><dt class="col-sm-4">Payment</dt><dd class="col-sm-8" th:text="${order.paymentStatus}"></dd></dl><h2 class="h5">Items</h2><table class="table"><thead><tr><th>Equipment</th><th>Quantity</th><th>Historical unit price</th></tr></thead><tbody><tr th:each="detail : ${order.details}"><td th:text="${detail.equipmentId}"></td><td th:text="${detail.quantity}"></td><td th:text="${detail.unitPrice}"></td></tr></tbody></table></div></section></main></body></html>
