<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head('Chi tiết đơn thuê')}"></th:block></head>
<body><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4 py-md-5" style="max-width:900px">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/rentals}">Quay lại đơn thuê</a>
    <th:block th:replace="~{fragments/alerts :: alerts(${success}, ${error})}"></th:block>
    <section class="card border-0"><div class="card-body p-4 p-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><div><p class="section-eyebrow mb-1">CHI TIẾT ĐƠN THUÊ</p><h1 class="h3 mb-0" th:text="${'Đơn thuê ' + order.id}"></h1></div><span th:replace="~{fragments/status-badges :: rental(${stateName})}"></span></div>
        <dl class="row rental-summary"><dt class="col-sm-4">Khách hàng</dt><dd class="col-sm-8" th:text="${order.customerId}"></dd><dt class="col-sm-4">Ngày thuê</dt><dd class="col-sm-8" th:text="${order.rentalDate}"></dd><dt class="col-sm-4">Ngày dự kiến trả</dt><dd class="col-sm-8" th:text="${order.expectedReturnDate}"></dd><dt class="col-sm-4" th:if="${order.actualReturnDate != null}">Ngày trả thực tế</dt><dd class="col-sm-8" th:if="${order.actualReturnDate != null}" th:text="${order.actualReturnDate}"></dd><dt class="col-sm-4">Thanh toán</dt><dd class="col-sm-8"><span th:replace="~{fragments/status-badges :: payment(${order.paymentStatus})}"></span></dd></dl>
        <div class="d-flex flex-wrap gap-2 border-top pt-3 mb-4"><a class="btn btn-outline-success" th:href="@{/checkout/{id}(id=${order.id})}">Thanh toán / định giá</a><form th:if="${stateName == 'PENDING'}" method="post" th:action="@{/rentals/{id}/confirm(id=${order.id})}"><button class="btn btn-success" type="submit">Xác nhận</button></form><form th:if="${stateName == 'PENDING' or stateName == 'CONFIRMED'}" method="post" th:action="@{/rentals/{id}/cancel(id=${order.id})}" onsubmit="return confirm('Hủy đơn thuê này? Đơn đã xác nhận sẽ hoàn lại số lượng đã giữ.');"><button class="btn btn-outline-danger" type="submit">Hủy đơn</button></form><form th:if="${stateName == 'CONFIRMED'}" method="post" th:action="@{/rentals/{id}/rent(id=${order.id})}"><button class="btn btn-primary" type="submit">Bàn giao thiết bị</button></form><form th:if="${stateName == 'RENTED'}" method="post" th:action="@{/rentals/{id}/return(id=${order.id})}"><button class="btn btn-success" type="submit">Ghi nhận trả</button></form></div>
        <h2 class="h5">Thiết bị trong đơn</h2><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Thiết bị</th><th>Số lượng</th><th>Đơn giá tại thời điểm tạo đơn</th></tr></thead><tbody><tr th:each="detail : ${order.details}"><td th:text="${detail.equipmentId}"></td><td th:text="${detail.quantity}"></td><td th:text="${detail.unitPrice + ' VND'}"></td></tr></tbody></table></div>
    </div></section>
</main></body></html>
