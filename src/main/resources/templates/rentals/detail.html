<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rental detail</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><main class="container py-4 py-md-5" style="max-width:900px">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/rentals}">Back to rentals</a>
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <section class="card shadow-sm border-0"><div class="card-body p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h1 class="h3 text-success mb-0" th:text="${'Rental ' + order.id}"></h1><span class="badge fs-6" th:classappend="${stateName == 'RETURNED' ? ' text-bg-success' : (stateName == 'CANCELLED' ? ' text-bg-secondary' : ' text-bg-warning')}" th:text="${stateName}"></span></div>
        <dl class="row"><dt class="col-sm-4">Customer</dt><dd class="col-sm-8" th:text="${order.customerId}"></dd><dt class="col-sm-4">Rental date</dt><dd class="col-sm-8" th:text="${order.rentalDate}"></dd><dt class="col-sm-4">Expected return</dt><dd class="col-sm-8" th:text="${order.expectedReturnDate}"></dd><dt class="col-sm-4" th:if="${order.actualReturnDate != null}">Actual return</dt><dd class="col-sm-8" th:if="${order.actualReturnDate != null}" th:text="${order.actualReturnDate}"></dd><dt class="col-sm-4">Payment</dt><dd class="col-sm-8" th:text="${order.paymentStatus}"></dd></dl>
        <div class="d-flex flex-wrap gap-2 border-top pt-3 mb-4">
            <form th:if="${stateName == 'PENDING'}" method="post" th:action="@{/rentals/{id}/confirm(id=${order.id})}"><button class="btn btn-success" type="submit">Confirm</button></form>
            <form th:if="${stateName == 'PENDING' or stateName == 'CONFIRMED'}" method="post" th:action="@{/rentals/{id}/cancel(id=${order.id})}"><button class="btn btn-outline-danger" type="submit">Cancel</button></form>
            <form th:if="${stateName == 'CONFIRMED'}" method="post" th:action="@{/rentals/{id}/rent(id=${order.id})}"><button class="btn btn-primary" type="submit">Mark as Rented</button></form>
            <form th:if="${stateName == 'RENTED'}" method="post" th:action="@{/rentals/{id}/return(id=${order.id})}"><button class="btn btn-success" type="submit">Return</button></form>
        </div>
        <h2 class="h5">Items</h2><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Equipment</th><th>Quantity</th><th>Historical unit price</th></tr></thead><tbody><tr th:each="detail : ${order.details}"><td th:text="${detail.equipmentId}"></td><td th:text="${detail.quantity}"></td><td th:text="${detail.unitPrice}"></td></tr></tbody></table></div>
    </div></section>
</main></body></html>
