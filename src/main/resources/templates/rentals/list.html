<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head('Đơn thuê')}"></th:block></head>
<body class="bg-light">
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="h2 text-success mb-1">Rental orders</h1><p class="text-muted mb-0">Create and manage camping gear rentals.</p></div>
        <a class="btn btn-success" th:href="@{/rentals/new}">Create draft</a>
    </div>
    <th:block th:replace="~{fragments/alerts :: alerts(${success}, ${error})}"></th:block>
    <section class="card shadow-sm border-0">
        <div class="table-responsive" th:if="${not #lists.isEmpty(rentals)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>ID</th><th>Customer</th><th>Rental date</th><th>Expected return</th><th>State</th><th>Payment</th><th class="text-end">Actions</th></tr></thead>
                <tbody><tr th:each="rental : ${rentals}">
                    <td class="fw-semibold" th:text="${rental.id}"></td><td th:text="${rental.customerId}"></td><td th:text="${rental.rentalDate}"></td><td th:text="${rental.expectedReturnDate}"></td>
                    <td><span th:replace="~{fragments/status-badges :: rental(${rentalStates[rental.id]})}"></span></td>
                    <td><span th:replace="~{fragments/status-badges :: payment(${rental.paymentStatus})}"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-success" th:href="@{/rentals/{id}(id=${rental.id})}">View</a></td>
                </tr></tbody>
            </table>
        </div>
        <div class="text-center py-5 px-3" th:if="${#lists.isEmpty(rentals)}">
            <h2 class="h5 text-success">No rental orders yet</h2><p class="text-muted mb-3">Start by creating a server-defined camping package draft.</p><a class="btn btn-success" th:href="@{/rentals/new}">Create first draft</a>
        </div>
    </section>
</main>
</body>
</html>
