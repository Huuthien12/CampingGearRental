<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rentals</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="bg-light"><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3 text-success">Rental orders</h1><a class="btn btn-success" th:href="@{/rentals/new}">Create draft</a></div><div class="card shadow-sm border-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>ID</th><th>Customer</th><th>Rental date</th><th>Expected return</th><th>State</th><th>Payment</th><th></th></tr></thead><tbody><tr th:each="rental : ${rentals}"><td th:text="${rental.id}"></td><td th:text="${rental.customerId}"></td><td th:text="${rental.rentalDate}"></td><td th:text="${rental.expectedReturnDate}"></td><td th:text="${rentalStates[rental.id]}"></td><td th:text="${rental.paymentStatus}"></td><td><a class="btn btn-sm btn-outline-success" th:href="@{/rentals/{id}(id=${rental.id})}">View</a></td></tr><tr th:if="${#lists.isEmpty(rentals)}"><td colspan="7" class="text-center text-muted">No rental orders found.</td></tr></tbody></table></div></div></main></body></html>
