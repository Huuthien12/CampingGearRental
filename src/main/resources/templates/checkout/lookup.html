<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Checkout</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container py-5"><a th:href="@{/}" class="link-secondary">Back to home</a><h1 class="mt-3">Checkout</h1><p class="text-secondary">Enter a persisted rental ID to review its pricing and payment status.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/checkout/load}" class="row g-2"><div class="col-md-6"><label class="form-label" for="rentalId">Rental ID</label><input id="rentalId" class="form-control" name="rentalId" required autofocus></div><div class="col-auto align-self-end"><button class="btn btn-success">Load rental</button></div></form></main></body></html>
