<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Checkout</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4"><div class="d-flex gap-3"><a th:href="@{/checkout}" class="link-secondary">Back to Checkout</a><a th:href="@{/rentals/{id}(id=${order.id})}" class="link-secondary">Back to Rental</a></div><div class="d-flex justify-content-between align-items-center mt-3"><h1 class="mb-0">Checkout <span th:text="${order.id}"></span></h1><span class="badge text-bg-success" th:if="${order.paymentStatus.name() == 'PAID'}">Paid</span><span class="badge text-bg-warning" th:unless="${order.paymentStatus.name() == 'PAID'}" th:text="${order.paymentStatus}"></span></div><div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div><section class="card mt-3"><div class="card-body"><h2 class="h5">Rental information</h2><dl class="row mb-0"><dt class="col-sm-4">Customer reference</dt><dd class="col-sm-8" th:text="${order.customerId}"></dd><dt class="col-sm-4">Rental state</dt><dd class="col-sm-8" th:text="${rentalState}"></dd><dt class="col-sm-4">Rental date</dt><dd class="col-sm-8" th:text="${order.rentalDate}"></dd><dt class="col-sm-4">Expected return date</dt><dd class="col-sm-8" th:text="${order.expectedReturnDate}"></dd><th:block th:if="${order.actualReturnDate != null}"><dt class="col-sm-4">Actual return date</dt><dd class="col-sm-8" th:text="${order.actualReturnDate}"></dd></th:block></dl></div></section><section class="card mt-3"><div class="card-body"><h2 class="h5">Rental items</h2><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Equipment reference</th><th>Quantity</th><th>Historical unit price</th></tr></thead><tbody><tr th:each="detail : ${order.details}"><td th:text="${detail.equipmentId}"></td><td th:text="${detail.quantity}"></td><td th:text="${detail.unitPrice}"></td></tr></tbody></table></div></div></section><section class="card mt-3"><div class="card-body"><h2 class="h5">Pricing summary</h2><dl class="row mb-0"><dt class="col-sm-4">Rental days</dt><dd class="col-sm-8" th:text="${rentalDays}"></dd><dt class="col-sm-4">Subtotal</dt><dd class="col-sm-8" th:text="${order.subtotal}"></dd><dt class="col-sm-4">Discount</dt><dd class="col-sm-8" th:text="${order.discount}"></dd><dt class="col-sm-4">Total</dt><dd class="col-sm-8 fw-bold" th:text="${order.total}"></dd></dl></div></section><section class="mt-3"><h2 class="h5">Actions</h2><div class="d-flex gap-2"><form method="post" th:action="@{|/checkout/${order.id}/refresh|}"><button class="btn btn-primary">Refresh pricing</button></form><form method="post" th:if="${order.paymentStatus.name() == 'UNPAID'}" th:action="@{|/checkout/${order.id}/pay|}"><button class="btn btn-success">Confirm Payment</button></form></div></section></main></body></html>
