<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Checkout</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><main class="container py-4"><a th:href="@{/checkout}">Back</a><h1>Checkout <span th:text="${order.id}"></span></h1><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><p>Customer: <span th:text="${order.customerId}"></span> | Rental days: <span th:text="${rentalDays}"></span></p><p>State: <span th:text="${order.currentState.class.simpleName}"></span> | Payment: <span th:text="${order.paymentStatus}"></span></p><table class="table"><tr><th>Equipment</th><th>Quantity</th><th>Historical unit price</th></tr><tr th:each="detail : ${order.details}"><td th:text="${detail.equipmentId}"></td><td th:text="${detail.quantity}"></td><td th:text="${detail.unitPrice}"></td></tr></table><p>Subtotal: <span th:text="${order.subtotal}"></span> | Discount: <span th:text="${order.discount}"></span> | Total: <strong th:text="${order.total}"></strong></p><form method="post" th:action="@{|/checkout/${order.id}/refresh|}"><button class="btn btn-primary">Refresh pricing</button></form><form method="post" th:if="${order.paymentStatus.name() == 'UNPAID'}" th:action="@{|/checkout/${order.id}/pay|}" class="mt-2"><button class="btn btn-success">Confirm Payment</button></form><span class="badge text-bg-success mt-2" th:unless="${order.paymentStatus.name() == 'UNPAID'}">Paid</span></main></body></html>
