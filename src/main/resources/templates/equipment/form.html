<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing ? 'Edit equipment' : 'Add equipment'}">Equipment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container py-4" style="max-width: 800px">
    <h1 th:text="${editing ? 'Edit equipment' : 'Add equipment'}"></h1>
    <form method="post" th:object="${equipmentForm}"
          th:action="${editing} ? @{/equipment/{id}/edit(id=${current.equipmentId})} : @{/equipment}">
        <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p class="mb-1">Please correct the form:</p>
            <ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
        </div>
        <div class="mb-3"><label for="equipmentId" class="form-label">Equipment ID</label>
            <input id="equipmentId" class="form-control" th:field="*{equipmentId}" maxlength="20" required th:readonly="${editing}"></div>
        <div class="mb-3"><label for="name" class="form-label">Name</label>
            <input id="name" class="form-control" th:field="*{name}" maxlength="150" required></div>
        <div class="mb-3"><label for="categoryId" class="form-label">Category</label>
            <select id="categoryId" class="form-select" th:field="*{categoryId}" required>
                <option value="">Choose a category</option>
                <option th:each="category : ${categories}" th:value="${category.categoryId}" th:text="${category.name + ' (' + category.categoryId + ')'}"></option>
            </select>
            <div class="text-danger" th:if="${#lists.isEmpty(categories)}">No categories available. Equipment cannot be saved.</div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3"><label for="pricePerDay" class="form-label">Price/day (VND)</label>
                <input id="pricePerDay" type="number" class="form-control" th:field="*{pricePerDay}" step="0.01" min="0.01" required></div>
            <div class="col-md-6 mb-3"><label for="totalQuantity" class="form-label">Total quantity</label>
                <input id="totalQuantity" type="number" class="form-control" th:field="*{totalQuantity}" step="1" min="0" required></div>
        </div>
        <p class="text-muted" th:if="${!editing}">New equipment starts fully available.</p>
        <p class="text-muted" th:if="${editing}">Current available / total:
            <strong th:text="${current.availableQuantity + ' / ' + current.totalQuantity}"></strong>.
            Changing the total preserves the quantity currently reserved or rented.</p>
        <div class="mb-4"><label for="status" class="form-label">Status</label>
            <select id="status" class="form-select" th:field="*{status}" required>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
            </select></div>
        <button class="btn btn-success" type="submit" th:disabled="${#lists.isEmpty(categories)}">Save equipment</button>
        <a class="btn btn-outline-secondary" th:href="@{/equipment}">Cancel</a>
    </form>
</main>
</body></html>
