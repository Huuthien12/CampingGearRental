<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head(${editing ? 'Chỉnh sửa thiết bị' : 'Thêm thiết bị'})}"></th:block></head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container py-4 py-md-5">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/equipment}">Quay lại thiết bị</a>
    <section class="customer-form-card mx-auto">
        <p class="section-eyebrow mb-1" th:text="${editing ? 'CẬP NHẬT DANH MỤC' : 'THÊM VÀO DANH MỤC'}"></p>
        <h1 class="h2 mb-4" th:text="${editing ? 'Chỉnh sửa thiết bị' : 'Thêm thiết bị'}"></h1>
        <form method="post" th:object="${equipmentForm}" th:action="${editing} ? @{/equipment/{id}/edit(id=${current.equipmentId})} : @{/equipment}">
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><p class="mb-1 fw-semibold">Vui lòng kiểm tra lại biểu mẫu:</p><ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
            <div class="mb-3"><label for="equipmentId" class="form-label">Mã thiết bị</label><input id="equipmentId" class="form-control" th:field="*{equipmentId}" maxlength="20" required th:readonly="${editing}"></div>
            <div class="mb-3"><label for="name" class="form-label">Tên thiết bị</label><input id="name" class="form-control" th:field="*{name}" maxlength="150" required></div>
            <div class="mb-3"><label for="categoryId" class="form-label">Loại thiết bị</label><select id="categoryId" class="form-select" th:field="*{categoryId}" required><option value="">Chọn loại thiết bị</option><option th:each="category : ${categories}" th:value="${category.categoryId}" th:text="${@presentationLabels.category(category.name) + ' (' + category.categoryId + ')'}"></option></select><div class="text-danger" th:if="${#lists.isEmpty(categories)}">Chưa có loại thiết bị. Không thể lưu thiết bị.</div></div>
            <div class="row"><div class="col-md-6 mb-3"><label for="pricePerDay" class="form-label">Đơn giá/ngày (VND)</label><input id="pricePerDay" type="number" class="form-control" th:field="*{pricePerDay}" step="0.01" min="0.01" required></div><div class="col-md-6 mb-3"><label for="totalQuantity" class="form-label">Tổng số lượng</label><input id="totalQuantity" type="number" class="form-control" th:field="*{totalQuantity}" step="1" min="0" required></div></div>
            <p class="text-muted" th:if="${!editing}">Thiết bị mới sẽ có toàn bộ số lượng ở trạng thái sẵn sàng.</p>
            <p class="text-muted" th:if="${editing}">Sẵn sàng / tổng hiện tại: <strong th:text="${current.availableQuantity + ' / ' + current.totalQuantity}"></strong>. Thay đổi tổng số lượng vẫn giữ nguyên số lượng đang được giữ hoặc cho thuê.</p>
            <div class="mb-4"><label for="status" class="form-label">Trạng thái</label><select id="status" class="form-select" th:field="*{status}" required><option th:each="status : ${statuses}" th:value="${status}" th:text="${@presentationLabels.equipmentStatus(status)}"></option></select></div>
            <button class="btn btn-success" type="submit" th:disabled="${#lists.isEmpty(categories)}">Lưu thiết bị</button><a class="btn btn-outline-secondary" th:href="@{/equipment}">Hủy</a>
        </form>
    </section>
</main>
</body></html>
