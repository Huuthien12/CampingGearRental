<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head('Đăng nhập')}"></th:block></head>
<body class="login-page">
<main class="login-panel">
    <div class="login-mark" aria-hidden="true">⛺</div>
    <p class="login-eyebrow">CAMPING GEAR RENTAL</p>
    <h1 class="h2">Đăng nhập</h1>
    <p class="text-secondary mb-4">Đăng nhập bằng tài khoản nhân viên.</p>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label" for="username">Tên đăng nhập</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Mật khẩu</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Đăng nhập</button>
    </form>
</main>
</body>
</html>
