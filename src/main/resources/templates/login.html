<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Camping Gear Rental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-panel">
    <p class="login-eyebrow">CAMPING GEAR RENTAL</p>
    <h1>Đăng nhập</h1>
    <p class="text-secondary mb-4">Đăng nhập bằng tài khoản nhân viên.</p>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label" for="username">Tên đăng nhập</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Mật khẩu</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Đăng nhập</button>
    </form>
</main>
</body>
</html>
